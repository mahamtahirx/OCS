stages:
  - install
  - test

variables:
  MYSQL_HOST: mysql
  MYSQL_DATABASE: wksp_db
  MYSQL_USER: wksp_user
  MYSQL_PASSWORD: MYSQL321
  MYSQL_ROOT_PASSWORD: MYSQL321
  MYSQL_PORT: 3306
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}"
  SECRET_KEY: -ygcw&cjg9wr3tx$-2+f6drk0mpy!+8+yf&i_0y1-1ubriyf-c
  DEBUG: "True"

services:
  - name: mysql:8.0
    alias: mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

# Install Frontend
install-frontend:
  stage: install
  image: node:18
  script:
    - cd Downloads/workshop-management-system-main/workshop-management-system-main/frontend
    - npm install
  artifacts:
    paths:
      - Downloads/workshop-management-system-main/workshop-management-system-main/frontend/node_modules

# Install Backend
install-backend:
  stage: install
  image: python:3.11
  script:
    - pip install pipenv
    - cd Downloads/workshop-management-system-main/workshop-management-system-main/backend
    - pipenv install --dev
  artifacts:
    paths:
      - Downloads/workshop-management-system-main/workshop-management-system-main/backend/.venv

# Test Frontend
test-frontend:
  stage: test
  image: node:18
  script:
    - cd Downloads/workshop-management-system-main/workshop-management-system-main/frontend
    - npm test -- --watchAll=false

# Test Backend
test-backend:
  stage: test
  image: python:3.11
  script:
    - cd Downloads/workshop-management-system-main/workshop-management-system-main/backend
    - pip install pipenv
    - pipenv install --dev
    - pipenv run python manage.py test
